<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b22"/><stop offset="1" stop-color="#14262c"/></linearGradient>
    <linearGradient id="camera" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263d43"/><stop offset="1" stop-color="#10191f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#050b0e" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1440" height="1000" fill="url(#bg)"/>
  <circle cx="1240" cy="80" r="260" fill="#3d8064" opacity=".08"/>
  <text x="72" y="68" fill="#a5f2bf" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">FACE FINDER  /  PEOPLE &amp; ATTENDANCE</text>
  <text x="72" y="139" fill="#f1f5ef" font-family="Arial,sans-serif" font-size="42" font-weight="700">Your people, recognized.</text>
  <text x="72" y="176" fill="#a5b5b1" font-family="Arial,sans-serif" font-size="17">Mark attendance or identify people in a group photo.</text>
  <rect x="1190" y="52" width="178" height="42" rx="21" fill="#1b3034" stroke="#34514a"/>
  <circle cx="1215" cy="73" r="5" fill="#69dfa0"/><text x="1230" y="78" fill="#c5d3cc" font-family="Arial,sans-serif" font-size="14">Local face registry</text>

  <!-- Equal, aligned cards -->
  <g filter="url(#shadow)"><rect x="72" y="220" width="624" height="700" rx="18" fill="#192a31" stroke="#35484d"/><rect x="744" y="220" width="624" height="700" rx="18" fill="#192a31" stroke="#35484d"/></g>

  <!-- Attendance panel -->
  <rect x="104" y="252" width="42" height="42" rx="12" fill="#254237"/><text x="125" y="280" text-anchor="middle" fill="#a5f2bf" font-family="Arial,sans-serif" font-size="22">✓</text>
  <text x="162" y="269" fill="#a5f2bf" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ATTENDANCE</text>
  <text x="162" y="293" fill="#f1f5ef" font-family="Arial,sans-serif" font-size="20" font-weight="700">Check in with camera</text>
  <rect x="104" y="318" width="560" height="282" rx="12" fill="url(#camera)" stroke="#3c5559"/>
  <circle cx="384" cy="429" r="48" fill="#20363b" stroke="#52736b" stroke-width="2"/>
  <path d="M365 427h38l-4-10h-9l-4-6h-9l-4 6h-8z" fill="none" stroke="#a5f2bf" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="384" cy="426" r="7" fill="none" stroke="#a5f2bf" stroke-width="2.5"/>
  <text x="384" y="505" text-anchor="middle" fill="#dce6df" font-family="Arial,sans-serif" font-size="16" font-weight="600">Camera preview</text>
  <text x="384" y="530" text-anchor="middle" fill="#93a7a4" font-family="Arial,sans-serif" font-size="13">Your camera will start after you allow access</text>
  <rect x="104" y="616" width="560" height="54" rx="9" fill="#a5f2bf"/>
  <text x="384" y="650" text-anchor="middle" fill="#10221b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Open camera to give attendance</text>
  <rect x="104" y="688" width="272" height="54" rx="9" fill="#22363c" stroke="#45605e"/>
  <text x="240" y="722" text-anchor="middle" fill="#e5eee8" font-family="Arial,sans-serif" font-size="15" font-weight="600">Register a new person</text>
  <rect x="392" y="688" width="272" height="54" rx="9" fill="#22363c" stroke="#45605e"/>
  <text x="528" y="722" text-anchor="middle" fill="#e5eee8" font-family="Arial,sans-serif" font-size="15" font-weight="600">View attendance</text>
  <line x1="104" y1="766" x2="664" y2="766" stroke="#34484d"/>
  <text x="104" y="797" fill="#91a39e" font-family="Arial,sans-serif" font-size="13">Today’s check-ins</text>
  <rect x="104" y="814" width="560" height="70" rx="9" fill="#142329"/>
  <circle cx="132" cy="849" r="13" fill="#2d4c3e"/><path d="m126 849 4 4 8-9" fill="none" stroke="#a5f2bf" stroke-width="2"/>
  <text x="158" y="845" fill="#e7eee9" font-family="Arial,sans-serif" font-size="14" font-weight="600">No attendance recorded yet</text>
  <text x="158" y="866" fill="#8fa29d" font-family="Arial,sans-serif" font-size="12">Recognized people will appear here.</text>

  <!-- Photo recognition panel -->
  <rect x="776" y="252" width="42" height="42" rx="12" fill="#263d48"/><text x="797" y="280" text-anchor="middle" fill="#9cdded" font-family="Arial,sans-serif" font-size="22">⌕</text>
  <text x="834" y="269" fill="#9cdded" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">PHOTO RECOGNITION</text>
  <text x="834" y="293" fill="#f1f5ef" font-family="Arial,sans-serif" font-size="20" font-weight="700">Find people in a group photo</text>
  <rect x="776" y="318" width="560" height="282" rx="12" fill="url(#camera)" stroke="#3c5559" stroke-dasharray="7 6"/>
  <rect x="984" y="378" width="144" height="108" rx="12" fill="#20363b" stroke="#52736b" stroke-width="2"/>
  <path d="M1032 440h48l-5-13h-11l-5-7h-11l-5 7h-11z" fill="none" stroke="#9cdded" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="1056" cy="438" r="9" fill="none" stroke="#9cdded" stroke-width="2.5"/>
  <text x="1056" y="521" text-anchor="middle" fill="#dce6df" font-family="Arial,sans-serif" font-size="16" font-weight="600">Upload a group photo</text>
  <text x="1056" y="545" text-anchor="middle" fill="#93a7a4" font-family="Arial,sans-serif" font-size="13">JPG, PNG or WEBP · or take a photo</text>
  <rect x="776" y="616" width="560" height="54" rx="9" fill="#a5f2bf"/>
  <text x="1056" y="650" text-anchor="middle" fill="#10221b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Choose photo and identify faces</text>
  <text x="776" y="704" fill="#91a39e" font-family="Arial,sans-serif" font-size="13">Recognition results</text>
  <rect x="776" y="722" width="560" height="72" rx="9" fill="#142329"/>
  <circle cx="806" cy="758" r="13" fill="#2d4c3e"/><path d="m800 758 4 4 8-9" fill="none" stroke="#a5f2bf" stroke-width="2"/>
  <text x="832" y="754" fill="#e7eee9" font-family="Arial,sans-serif" font-size="14" font-weight="600">Recognized people</text>
  <text x="832" y="775" fill="#8fa29d" font-family="Arial,sans-serif" font-size="12">Names will appear here with boxes on the photo.</text>
  <rect x="776" y="806" width="560" height="78" rx="9" fill="#30291f" stroke="#806543"/>
  <circle cx="806" cy="845" r="13" fill="#59402b"/><text x="806" y="850" text-anchor="middle" fill="#ffc889" font-family="Arial,sans-serif" font-size="15" font-weight="700">?</text>
  <text x="832" y="838" fill="#ffd9a9" font-family="Arial,sans-serif" font-size="14" font-weight="600">Unknown faces</text>
  <text x="832" y="860" fill="#c7ad8e" font-family="Arial,sans-serif" font-size="12">Register an unknown person to recognize them next time.</text>
  <rect x="1200" y="826" width="116" height="38" rx="7" fill="#3d3427" stroke="#927344"/>
  <text x="1258" y="850" text-anchor="middle" fill="#ffe1b9" font-family="Arial,sans-serif" font-size="12" font-weight="700">Register</text>
  <text x="720" y="964" text-anchor="middle" fill="#70847f" font-family="Arial,sans-serif" font-size="12">FACE FINDER · Designed to keep both tasks clear and balanced</text>
</svg>
